    function loadScores() {
        const saved = localStorage.getItem("wc2026_scores");
        let parsed = saved ? JSON.parse(saved) : {};
        // Для каждого матча: если в коде есть счёт (не null), используем его, иначе берём из localStorage (если есть)
        matchList.forEach(m => {
            if (m.homeScore !== null && m.awayScore !== null) {
                scores[m.id] = { home: m.homeScore, away: m.awayScore };
            } else if (parsed[m.id] !== undefined) {
                scores[m.id] = parsed[m.id];
            } else {
                scores[m.id] = null;
            }
        });
        localStorage.setItem("wc2026_scores", JSON.stringify(scores));
    }

    function getPoints(predStr, realHome, realAway) {
        if (!predStr || predStr === "—") return 0;
        const [predHome, predAway] = predStr.split(':').map(Number);
        if (isNaN(predHome) || isNaN(predAway)) return 0;
        if (predHome === realHome && predAway === realAway) return 3;
        const realDiff = realHome - realAway;
        const predDiff = predHome - predAway;
        if (realDiff === predDiff) return 2;
        const realOutcome = realHome > realAway ? 1 : (realHome === realAway ? 0 : -1);
        const predOutcome = predHome > predAway ? 1 : (predHome === predAway ? 0 : -1);
        if (realOutcome === predOutcome) return 1;
        return 0;
    }

    function computeExpertsStats() {
        let stats = experts.map(name => ({ name, points: 0, exact: 0, diff: 0, outcome: 0 }));
        for (let m of matchList) {
            const real = scores[m.id];
            if (!real || real.home === undefined) continue;
            if (!m.pred) continue;
            for (let i = 0; i < experts.length; i++) {
                const pts = getPoints(m.pred[i], real.home, real.away);
                if (pts === 3) { stats[i].points += 3; stats[i].exact++; }
                else if (pts === 2) { stats[i].points += 2; stats[i].diff++; }
                else if (pts === 1) { stats[i].points += 1; stats[i].outcome++; }
            }
        }
        stats.forEach(s => { s.totalOutcomes = s.exact + s.diff + s.outcome; });
        stats.sort((a,b) => b.points - a.points || b.exact - a.exact || b.diff - a.diff);
        return stats;
    }

    function countPlayedMatches() {
        let count = 0;
        for (let m of matchList) {
            const s = scores[m.id];
            if (s && s.home !== undefined && s.away !== undefined) count++;
        }
        return count;
    }

    function renderExpertsRank() {
        const stats = computeExpertsStats();
        const played = countPlayedMatches();
        let html = `<h3>
                        <span><i class="fas fa-trophy"></i> 🏆 Рейтинг экспертов</span>
                        <span class="matches-played">Сыграно ${played} матчей</span>
                    </h3>
            <table class="rank-table"><thead><tr><th>Место</th><th>Эксперт</th><th>Очки</th><th>Точных</th><th>Разниц</th><th>Исходов</th><th>Всего</th></tr></thead><tbody>`;
        stats.forEach((exp, idx) => {
            let medalClass = "";
            if (idx === 0) medalClass = "rank-1";
            else if (idx === 1) medalClass = "rank-2";
            else if (idx === 2) medalClass = "rank-3";
            html += `<tr class="${medalClass}"><td>${idx+1}</td><td class="expert-name">${exp.name}</td>
                     <td><strong>${exp.points}</strong></td>
                      <td>${exp.exact}</td>
                      <td>${exp.diff}</td>
                      <td>${exp.outcome}</td>
                      <td>${exp.totalOutcomes}</td>
                    </tr>`;
        });
        html += `</tbody></table>`;
        document.getElementById('expertsRankContainer').innerHTML = html;
    }

    function computeStandings(group) {
        if (!/^[A-L]$/i.test(group)) return [];
        const groupMatches = matchList.filter(m => m.group === group);
        const teams = [...new Set(groupMatches.flatMap(m => [m.home, m.away]))].filter(t => t);
        const stats = {};
        teams.forEach(t => stats[t] = { played:0, wins:0, draws:0, losses:0, gf:0, ga:0, pts:0 });
        groupMatches.forEach(m => {
            const s = scores[m.id];
            if (s && s.home !== undefined && s.away !== undefined) {
                const hg = s.home, ag = s.away;
                stats[m.home].gf += hg; stats[m.home].ga += ag;
                stats[m.away].gf += ag; stats[m.away].ga += hg;
                stats[m.home].played++; stats[m.away].played++;
                if (hg > ag) { stats[m.home].wins++; stats[m.home].pts += 3; stats[m.away].losses++; }
                else if (hg < ag) { stats[m.away].wins++; stats[m.away].pts += 3; stats[m.home].losses++; }
                else { stats[m.home].draws++; stats[m.away].draws++; stats[m.home].pts++; stats[m.away].pts++; }
            }
        });
        return teams.map(name => ({ name, ...stats[name] })).sort((a,b) => b.pts - a.pts || (b.gf - b.ga) - (a.gf - a.ga) || b.gf - a.gf);
    }

    function renderStandings(group) {
        const container = document.getElementById('standingsContainer');
        if (!group || group === 'all' || !/^[A-L]$/i.test(group)) {
            container.classList.remove('active');
            container.innerHTML = '';
            return;
        }
        const table = computeStandings(group);
        if (table.length === 0) {
            container.classList.remove('active');
            container.innerHTML = '';
            return;
        }
        container.classList.add('active');
        let html = `<h3><i class="fas fa-table"></i> Группа ${group} · Таблица</h3>
            <table><thead><tr><th>Команда</th><th>И</th><th>В</th><th>Н</th><th>П</th><th>З</th><th>П</th><th>О</th></tr></thead><tbody>`;
        table.forEach(t => {
            html += `<tr><td class="team-name">${t.name}</td>
                        <td>${t.played}</td>
                        <td>${t.wins}</td>
                        <td>${t.draws}</td>
                        <td>${t.losses}</td>
                        <td>${t.gf}</td>
                        <td>${t.ga}</td>
                        <td><strong>${t.pts}</strong></td>
                    </tr>`;
        });
        html += `</tbody></table></div>`;
        container.innerHTML = html;
    }

    function updateTeamColors() {
        const activeGroup = getActiveGroup();
        let filtered = activeGroup === 'all' ? matchList : matchList.filter(m => m.group === activeGroup);
        filtered = filtered.filter(m => m.home);
        for (let m of filtered) {
            const s = scores[m.id];
            const homeDiv = document.querySelector(`.match-card[data-id='${m.id}'] .team:first-child`);
            const awayDiv = document.querySelector(`.match-card[data-id='${m.id}'] .team:last-child`);
            if (!homeDiv || !awayDiv) continue;
            homeDiv.classList.remove('win', 'loss', 'draw');
            awayDiv.classList.remove('win', 'loss', 'draw');
            if (s && s.home !== undefined && s.away !== undefined) {
                if (s.home > s.away) {
                    homeDiv.classList.add('win');
                    awayDiv.classList.add('loss');
                } else if (s.home < s.away) {
                    homeDiv.classList.add('loss');
                    awayDiv.classList.add('win');
                } else {
                    homeDiv.classList.add('draw');
                    awayDiv.classList.add('draw');
                }
            }
        }
    }

    function getActiveGroup() {
        const activeBtn = document.querySelector('.bottom-btn.active');
        return activeBtn ? activeBtn.getAttribute('data-group') : 'all';

    function renderMatches() {
        const activeGroup = getActiveGroup();
        let filtered = activeGroup === 'all' ? matchList : matchList.filter(m => m.group === activeGroup);
        filtered = filtered.filter(m => m.home);
        let html = '';
        for (let m of filtered) {
            const pred = m.pred ? m.pred : experts.map(() => '—');
            const s = scores[m.id];
            const homeVal = s?.home !== undefined ? s.home : '';
            const awayVal = s?.away !== undefined ? s.away : '';
            const isPlayed = s && s.home !== undefined && s.away !== undefined;

            const matchNumber = String(m.id).padStart(2, '0');
            const groupLabel = m.group.length === 1 ? `Группа ${m.group}` : m.group;

            html += `
                <div class="match-card" data-id="${m.id}">
                    <div class="card-header">
                        <span class="group-badge">${groupLabel} · Матч ${matchNumber}</span>
                        <span>${m.date} ${m.time}</span>
                    </div>
                    <div class="teams">
                        <div class="team"><i class="fas fa-shield-alt"></i> ${m.home}</div>
                        <div class="vs">VS</div>
                        <div class="team">${m.away} <i class="fas fa-shield-alt"></i></div>
                    </div>
                    <div class="score-inputs">
                        <input type="number" class="home-score" value="${homeVal}" placeholder="0" disabled>
                        <span>:</span>
                        <input type="number" class="away-score" value="${awayVal}" placeholder="0" disabled>
                    </div>
                    <div class="experts-grid">
                        ${experts.map((exp, idx) => {
                            const predScore = pred[idx];
                            let colorClass = '';
                            if (isPlayed) {
                                const pts = getPoints(predScore, s.home, s.away);
                                if (pts === 3) colorClass = 'pred-exact';
                                else if (pts === 2) colorClass = 'pred-diff';
                                else if (pts === 1) colorClass = 'pred-outcome';
                                else colorClass = 'pred-none';
                            } else {
                                colorClass = 'pred-score-default';
                            }
                            return `<div class="expert-pred">
                                        <span class="expert-name">${exp}</span>
                                        <span class="pred-score ${colorClass}">${predScore}</span>
                                    </div>`;
                        }).join('')}
                    </div>
                </div>
            `;
        }
        document.getElementById('matchesContainer').innerHTML = html;
        updateTeamColors();
    }

    function buildBottomFilters() {
        const groups = [...new Set(matchList.map(m => m.group))].filter(g => g);
        const order = { 'A':1,'B':2,'C':3,'D':4,'E':5,'F':6,'G':7,'H':8,'I':9,'J':10,'K':11,'L':12,
                        '1/16':13, '1/8':14, '1/4':15, '1/2':16, '3 место':17, 'Финал':18 };
        groups.sort((a,b) => (order[a] || 99) - (order[b] || 99));

        const container = document.getElementById('bottomPanel');
        const googleLink = 'https://docs.google.com/spreadsheets/d/15Jp5y370IZmL8wFZPWFSGBjwKEGhv8xb4Ip3Jp_AdRU/edit?gid=0';
        const yandexLink = 'https://disk.yandex.ru/i/E4P3CeXAjFgujQ';

        let html = `<button class="bottom-btn active" data-group="all">🌍 Все</button>`;
        html += groups.map(g => `<button class="bottom-btn" data-group="${g}">${g}</button>`).join('');
        html += `<a href="https://sor236.github.io/WCF2026/table.html" target="_blank" class="bottom-link"><i class="fas fa-table"></i> Общая</a>`;
        html += `<a href="${googleLink}" target="_blank" class="bottom-link"><i class="fab fa-google"></i> Google</a>`;
        html += `<a href="${yandexLink}" target="_blank" class="bottom-link"><i class="fab fa-yandex"></i> Яндекс</a>`;

        container.innerHTML = html;

        container.querySelectorAll('.bottom-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                container.querySelectorAll('.bottom-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const group = btn.getAttribute('data-group');
                renderMatches();
                renderStandings(group);
            });
        });

        renderStandings('all');
    }

    loadScores();
    buildBottomFilters();
    renderExpertsRank();
    renderMatches();
</script>
</body>
</html>
