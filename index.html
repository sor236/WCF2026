<body>
<div class="app">
    <div class="hero">
        <h1><i class="fas fa-futbol"></i> ЧМ 2026 · Рейтинг экспертов</h1>
        <div class="sub">Данные загружены из Google Таблицы (CSV)</div>
    </div>

    <div id="expertsRankContainer" class="experts-rank"></div>

    <div class="filter-bar" id="filterBar"></div>

    <div id="standingsContainer"></div>
    <div class="matches-grid" id="matchesContainer"></div>
    <div class="footer-note">
        <i class="fas fa-chart-line"></i> Для изменения счетов нажмите "Редактировать", введите пароль и меняйте результаты.
    </div>
</div>

<div class="bottom-panel" id="bottomPanel">
    <button id="unlockBtn" class="bottom-btn unlock"><i class="fas fa-lock"></i> Редактировать</button>
    <button id="resetScoresBtn" class="bottom-btn reset"><i class="fas fa-undo-alt"></i> Сбросить все счета</button>
    <span id="lockStatus">(заблокировано)</span>
</div>

<script>
    // ==================== НАСТРОЙКА ====================
    // Замените на вашу ссылку опубликованного CSV (Файл → Опубликовать в интернете → CSV)
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTiW8f1X4s-HEU54NEiIVmesOJ6mKAZLXQBzdcwEVhDFW8tY9h3XeD2C7nc-FpQTclyTgZ9sBGLgxg4/pub?gid=0&single=true&output=csv';
    // ===================================================

    const EDIT_PASSWORD = "admin123";
    let isUnlocked = false;

    // Хранилище данных, загруженных из CSV
    let matches = [];          // массив объектов матча: { group, date, time, home, away, pred, scoreHome, scoreAway }
    let experts = [];         // список экспертов (из заголовков)
    let scores = {};          // id -> { home, away } (для редактирования, начальные из CSV)

    // ---- Вспомогательные функции парсинга CSV ----
    function parseCSV(csvText) {
        const rows = csvText.split(/\r?\n/);
        if (rows.length < 2) return [];
        const headers = rows[0].split(',').map(h => h.replace(/^["']|["']$/g, '').trim());
        const data = [];
        for (let i = 1; i < rows.length; i++) {
            if (!rows[i].trim()) continue;
            const values = rows[i].split(',').map(v => v.replace(/^["']|["']$/g, '').trim());
            const obj = {};
            headers.forEach((h, idx) => { obj[h] = values[idx] || ''; });
            data.push(obj);
        }
        return { headers, data };
    }

    // Автоопределение колонок
    function detectColumns(headers) {
        const lowerHeaders = headers.map(h => h.toLowerCase());
        const find = (patterns) => headers.find((_, idx) => patterns.some(p => lowerHeaders[idx].includes(p)));
        
        const groupCol = find(['групп', 'group']);
        const dateCol = find(['дата', 'date']);
        const timeCol = find(['время', 'time']);
        const homeCol = find(['хозя', 'home', 'команда1']);
        const awayCol = find(['гост', 'away', 'команда2']);
        const scoreHomeCol = find(['голы хозя', 'счёт хозя', 'home score']);
        const scoreAwayCol = find(['голы гост', 'счёт гост', 'away score']);
        
        // Прогнозы экспертов: ищем колонки, содержащие имена Антон, Георгий, Герман, Олег, Тимур, Юрий
        const expertNames = [];
        const expertCols = [];
        const nameVariants = ['антон', 'anton', 'георгий', 'georgiy', 'герман', 'german', 'олег', 'oleg', 'тимур', 'timur', 'юрий', 'yuriy'];
        for (let i = 0; i < headers.length; i++) {
            const low = headers[i].toLowerCase();
            for (let name of nameVariants) {
                if (low.includes(name)) {
                    expertNames.push(headers[i]);
                    expertCols.push(i);
                    break;
                }
            }
        }
        // Если не нашли по именам, ищем колонки с "прогноз" или "pred"
        if (expertCols.length === 0) {
            for (let i = 0; i < headers.length; i++) {
                if (headers[i].toLowerCase().includes('прогноз') || headers[i].toLowerCase().includes('pred')) {
                    expertCols.push(i);
                    expertNames.push(headers[i]);
                }
            }
        }
        
        return {
            groupIdx: headers.indexOf(groupCol),
            dateIdx: headers.indexOf(dateCol),
            timeIdx: headers.indexOf(timeCol),
            homeIdx: headers.indexOf(homeCol),
            awayIdx: headers.indexOf(awayCol),
            scoreHomeIdx: headers.indexOf(scoreHomeCol),
            scoreAwayIdx: headers.indexOf(scoreAwayCol),
            expertCols, expertNames
        };
    }

    // Загрузка и обработка CSV
    async function loadAndBuild() {
        try {
            const resp = await fetch(CSV_URL);
            const csvText = await resp.text();
            const { headers, data } = parseCSV(csvText);
            const cols = detectColumns(headers);
            
            // Формируем массив матчей
            matches = [];
            experts = cols.expertNames.length ? cols.expertNames : ['Антон', 'Георгий', 'Герман', 'Олег', 'Тимур', 'Юрий'];
            if (experts.length > 6) experts = experts.slice(0,6);
            if (experts.length < 6) {
                while (experts.length < 6) experts.push(`Эксперт${experts.length+1}`);
            }
            
            for (let row of data) {
                const group = cols.groupIdx !== -1 ? row[headers[cols.groupIdx]] : '';
                const date = cols.dateIdx !== -1 ? row[headers[cols.dateIdx]] : '';
                const time = cols.timeIdx !== -1 ? row[headers[cols.timeIdx]] : '';
                const home = cols.homeIdx !== -1 ? row[headers[cols.homeIdx]] : '';
                const away = cols.awayIdx !== -1 ? row[headers[cols.awayIdx]] : '';
                
                // Счёт (если есть отдельные колонки)
                let scoreHome = null, scoreAway = null;
                if (cols.scoreHomeIdx !== -1 && cols.scoreAwayIdx !== -1) {
                    scoreHome = parseInt(row[headers[cols.scoreHomeIdx]]);
                    scoreAway = parseInt(row[headers[cols.scoreAwayIdx]]);
                    if (isNaN(scoreHome)) scoreHome = null;
                    if (isNaN(scoreAway)) scoreAway = null;
                } else {
                    // возможно, есть одна колонка "счёт" вида "2:1"
                    const scoreCol = headers.find(h => h.toLowerCase().includes('счёт') || h.toLowerCase().includes('score'));
                    if (scoreCol) {
                        const scoreStr = row[scoreCol];
                        if (scoreStr && scoreStr.includes(':')) {
                            const parts = scoreStr.split(':');
                            scoreHome = parseInt(parts[0]);
                            scoreAway = parseInt(parts[1]);
                        }
                    }
                }
                
                // Прогнозы экспертов
                let pred = [];
                for (let i = 0; i < experts.length; i++) {
                    let predStr = '';
                    if (i < cols.expertCols.length) {
                        predStr = row[headers[cols.expertCols[i]]] || '';
                    } else {
                        predStr = '';
                    }
                    // если прогноз в формате "X:Y" — хорошо, иначе пробуем объединить две колонки (не поддерживается)
                    if (!predStr.includes(':') && predStr.match(/^\d+$/)) {
                        // возможно, это только одна цифра — попробуем найти вторую колонку рядом
                        // упростим: оставляем как есть
                    }
                    pred.push(predStr);
                }
                // если все прогнозы пустые, оставляем null
                if (pred.every(p => !p)) pred = null;
                
                matches.push({
                    group, date, time, home, away,
                    scoreHome, scoreAway,
                    pred: pred
                });
            }
            
            // Инициализация scores: если в CSV был счёт, используем его, иначе null
            matches.forEach((m, idx) => {
                if (m.scoreHome !== null && m.scoreAway !== null) {
                    scores[idx] = { home: m.scoreHome, away: m.scoreAway };
                } else {
                    scores[idx] = null;
                }
            });
            
            // Построение интерфейса
            buildFilterButtons();
            renderExpertsRank();
            renderStandings(getCurrentGroup());
            renderMatches(getCurrentGroup());
            
        } catch (err) {
            console.error('Ошибка загрузки CSV:', err);
            document.getElementById('matchesContainer').innerHTML = '<div style="text-align:center; padding:2rem;">❌ Не удалось загрузить данные. Проверьте, что таблица опубликована как CSV и ссылка верна.</div>';
        }
    }

    // ----- Остальные функции (рендер, очки, таблица) аналогичны предыдущим, но работают с matches -----
    function getCurrentGroup() {
        const active = document.querySelector('.filter-btn.active');
        return active ? active.getAttribute('data-group') : 'all';
    }
    
    function buildFilterButtons() {
        const groups = [...new Set(matches.map(m => m.group).filter(g => g))].sort();
        const container = document.getElementById('filterBar');
        let html = `<button class="filter-btn active" data-group="all">🌍 Все группы</button>`;
        groups.forEach(g => {
            html += `<button class="filter-btn" data-group="${g}">Группа ${g}</button>`;
        });
        container.innerHTML = html;
        // привязать события
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const grp = btn.getAttribute('data-group');
                renderMatches(grp);
                renderExpertsRank();
                if (grp !== 'all') renderStandings(grp);
                else document.getElementById('standingsContainer').innerHTML = '';
            });
        });
    }
    
    function getPoints(predStr, realHome, realAway) {
        if (!predStr || predStr === "—") return 0;
        const [predHome, predAway] = predStr.split(':').map(Number);
        if (isNaN(predHome) || isNaN(predAway)) return 0;
        if (predHome === realHome && predAway === realAway) return 3;
        const realDiff = realHome - realAway;
        const predDiff = predHome - predAway;
        if (realDiff === predDiff) return 2;
        const realOutcome = (realHome > realAway) ? 1 : (realHome === realAway ? 0 : -1);
        const predOutcome = (predHome > predAway) ? 1 : (predHome === predAway ? 0 : -1);
        if (realOutcome === predOutcome) return 1;
        return 0;
    }
    
    function computeExpertsStats() {
        let stats = experts.map(name => ({ name, points: 0, exact: 0, diff: 0, outcome: 0 }));
        for (let i = 0; i < matches.length; i++) {
            const score = scores[i];
            if (!score || score.home === undefined) continue;
            const realHome = score.home, realAway = score.away;
            const predArr = matches[i].pred;
            if (!predArr) continue;
            for (let e = 0; e < experts.length; e++) {
                const pts = getPoints(predArr[e], realHome, realAway);
                if (pts === 3) { stats[e].points += 3; stats[e].exact++; }
                else if (pts === 2) { stats[e].points += 2; stats[e].diff++; }
                else if (pts === 1) { stats[e].points += 1; stats[e].outcome++; }
            }
        }
        stats.sort((a,b) => b.points - a.points || b.exact - a.exact || b.diff - a.diff);
        return stats;
    }
    
    function renderExpertsRank() {
        const container = document.getElementById("expertsRankContainer");
        const stats = computeExpertsStats();
        let html = `<h3><i class="fas fa-trophy"></i> 🏆 Рейтинг экспертов (3 — точный счёт, 2 — разница, 1 — исход)</h3>
            <table class="rank-table"><thead><tr><th>Место</th><th>Эксперт</th><th>Очки</th><th>Точных<br>счетов</th><th>Разниц<br>(2 очка)</th><th>Исходов<br>(1 очко)</th></tr></thead><tbody>`;
        stats.forEach((exp, idx) => {
            let medalClass = (idx === 0) ? "rank-1" : (idx === 1) ? "rank-2" : (idx === 2) ? "rank-3" : "";
            html += `<tr class="${medalClass}"><td>${idx+1}</td><td class="expert-name">${exp.name}</td>
                     <td><strong>${exp.points}</strong></td><td>${exp.exact}</td><td>${exp.diff}</td><td>${exp.outcome}</td></tr>`;
        });
        html += `</tbody></table>`;
        container.innerHTML = html;
    }
    
    function computeStandings(group) {
        const groupMatches = matches.filter((m, idx) => m.group === group);
        const teamsSet = new Set();
        groupMatches.forEach(m => { teamsSet.add(m.home); teamsSet.add(m.away); });
        let teams = Array.from(teamsSet).sort();
        const stats = {};
        teams.forEach(team => { stats[team] = { played:0, wins:0, draws:0, losses:0, gf:0, ga:0, points:0 }; });
        groupMatches.forEach((m, idx) => {
            const score = scores[idx];
            if (score && score.home !== undefined) {
                const hg = score.home, ag = score.away;
                stats[m.home].gf += hg; stats[m.home].ga += ag;
                stats[m.away].gf += ag; stats[m.away].ga += hg;
                stats[m.home].played++; stats[m.away].played++;
                if (hg > ag) { stats[m.home].wins++; stats[m.home].points += 3; stats[m.away].losses++; }
                else if (hg < ag) { stats[m.away].wins++; stats[m.away].points += 3; stats[m.home].losses++; }
                else { stats[m.home].draws++; stats[m.away].draws++; stats[m.home].points++; stats[m.away].points++; }
            }
        });
        let table = teams.map(team => ({ name:team, ...stats[team] }));
        table.sort((a,b) => b.points - a.points || (b.gf - b.ga) - (a.gf - a.ga) || b.gf - a.gf);
        return table;
    }
    
    function renderStandings(group) {
        const container = document.getElementById("standingsContainer");
        if (group === "all") { container.innerHTML = ''; return; }
        const standings = computeStandings(group);
        if (!standings.length) return;
        let html = `<div class="standings"><h3><i class="fas fa-table"></i> Группа ${group} · Турнирная таблица</h3>
            <table><thead><tr><th>Команда</th><th>И</th><th>В</th><th>Н</th><th>П</th><th>З</th><th>П</th><th>О</th></tr></thead><tbody>`;
        standings.forEach(t => {
            html += `<tr><td class="team-name">${t.name}</td><td>${t.played}</td><td>${t.wins}</td><td>${t.draws}</td><td>${t.losses}</td><td>${t.gf}</td><td>${t.ga}</td><td>${t.points}</td></tr>`;
        });
        html += `</tbody></table></div>`;
        container.innerHTML = html;
    }
    
    function renderMatches(group) {
        const container = document.getElementById("matchesContainer");
        let filtered = group === "all" ? matches : matches.filter((m, idx) => m.group === group);
        if (filtered.length === 0) {
            container.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:2rem;">Нет матчей в этой группе</div>`;
            return;
        }
        let html = "";
        filtered.forEach((match, filterIdx) => {
            const originalIdx = matches.findIndex((m, i) => m === match); // грязно, но работает
            let predictions = match.pred ? match.pred : experts.map(() => "—");
            while (predictions.length < 6) predictions.push("—");
            const currentScore = scores[originalIdx];
            const homeVal = (currentScore && currentScore.home !== undefined) ? currentScore.home : '';
            const awayVal = (currentScore && currentScore.away !== undefined) ? currentScore.away : '';
            html += `
                <div class="match-card" data-match-id="${originalIdx}">
                    <div class="card-header">
                        <span class="group-badge"><i class="fas fa-users"></i> ГРУППА ${match.group}</span>
                        <div class="datetime"><i class="far fa-calendar-alt"></i> ${match.date} ${match.time}</div>
                    </div>
                    <div class="teams">
                        <div class="team"><i class="fas fa-shield-alt"></i> ${match.home}</div>
                        <div class="vs">VS</div>
                        <div class="team">${match.away} <i class="fas fa-shield-alt"></i></div>
                    </div>
                    <div class="score-inputs">
                        <input type="number" class="home-score" placeholder="0" value="${homeVal}" step="1" min="0" ${!isUnlocked ? 'disabled' : ''}>
                        <span style="font-weight:bold">:</span>
                        <input type="number" class="away-score" placeholder="0" value="${awayVal}" step="1" min="0" ${!isUnlocked ? 'disabled' : ''}>
                    </div>
                    <div class="forecast-title"><i class="fas fa-chart-simple"></i> ПРОГНОЗЫ ЭКСПЕРТОВ</div>
                    <div class="experts-grid">
                        ${experts.map((exp, idx) => `<div class="expert-pred"><div class="expert-name">${exp}</div><div class="expert-score">${predictions[idx]}</div></div>`).join('')}
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
        
        if (isUnlocked) {
            document.querySelectorAll('.match-card').forEach(card => {
                const id = parseInt(card.getAttribute('data-match-id'));
                const homeInput = card.querySelector('.home-score');
                const awayInput = card.querySelector('.away-score');
                const update = () => {
                    const hv = homeInput.value === '' ? undefined : parseInt(homeInput.value);
                    const av = awayInput.value === '' ? undefined : parseInt(awayInput.value);
                    if (hv !== undefined && av !== undefined && !isNaN(hv) && !isNaN(av)) {
                        scores[id] = { home: hv, away: av };
                    } else {
                        scores[id] = null;
                    }
                    // автосохранение в localStorage
                    localStorage.setItem('wc2026_scores', JSON.stringify(scores));
                    renderExpertsRank();
                    const grp = getCurrentGroup();
                    if (grp !== 'all') renderStandings(grp);
                };
                homeInput.addEventListener('input', update);
                awayInput.addEventListener('input', update);
            });
        }
    }
    
    function resetAllScores() {
        if (!isUnlocked) { alert("Редактирование заблокировано. Введите пароль."); return; }
        for (let i = 0; i < matches.length; i++) scores[i] = null;
        localStorage.removeItem('wc2026_scores');
        const grp = getCurrentGroup();
        renderMatches(grp);
        renderExpertsRank();
        if (grp !== 'all') renderStandings(grp);
    }
    
    function unlockEditor() {
        const pwd = prompt("Введите пароль для редактирования счетов:");
        if (pwd === EDIT_PASSWORD) {
            isUnlocked = true;
            document.getElementById('unlockBtn').innerHTML = '<i class="fas fa-check"></i> Режим активен';
            document.getElementById('unlockBtn').disabled = true;
            document.getElementById('lockStatus').innerHTML = '(разблокировано)';
            const grp = getCurrentGroup();
            renderMatches(grp);
        } else if (pwd !== null) alert("Неверный пароль!");
    }
    
    // Загрузка сохранённых счетов и инициализация
    function loadScoresFromLocal() {
        const saved = localStorage.getItem('wc2026_scores');
        if (saved) {
            try {
                const parsed = JSON.parse(saved);
                for (let id in parsed) scores[id] = parsed[id];
            } catch(e) {}
        }
    }
    
    window.onload = async () => {
        await loadAndBuild();
        loadScoresFromLocal();
        // если после загрузки CSV какие-то счета не определены, оставить null
        renderExpertsRank();
        renderStandings(getCurrentGroup());
        renderMatches(getCurrentGroup());
        document.getElementById('unlockBtn').addEventListener('click', unlockEditor);
        document.getElementById('resetScoresBtn').addEventListener('click', resetAllScores);
    };
</script>
</body>
</html>
