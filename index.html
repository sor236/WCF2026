<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ЧМ 2026 · Рейтинг экспертов (фиксированные индексы)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 10% 30%, #0a1f1e, #05100f);
            color: #f0f3f8;
            padding: 2rem 1rem;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 0.5rem; }
        .sub { text-align: center; margin-bottom: 2rem; opacity: 0.8; }
        .debug { background: #1e2f2c; color: #ffaa33; padding: 0.5rem; margin: 1rem 0; border-radius: 1rem; font-family: monospace; white-space: pre-wrap; }
        .filter-bar { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem; margin-bottom: 2rem; }
        .filter-btn { background: rgba(255,255,255,0.1); border: none; padding: 0.4rem 1rem; border-radius: 2rem; cursor: pointer; color: white; }
        .filter-btn.active { background: #2dd4bf; color: #05100f; font-weight: bold; }
        .matches-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 1.5rem; }
        .card { background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); border-radius: 1rem; padding: 1rem; border: 1px solid #2dd4bf40; }
        .card-header { display: flex; justify-content: space-between; margin-bottom: 0.5rem; font-size: 0.8rem; }
        .group-badge { background: #2dd4bf; color: #05100f; padding: 0.2rem 0.6rem; border-radius: 2rem; font-weight: bold; }
        .teams { display: flex; justify-content: space-between; align-items: center; margin: 1rem 0; font-size: 1.1rem; font-weight: bold; }
        .team { text-align: center; flex: 1; }
        .vs { margin: 0 0.5rem; }
        .score { text-align: center; font-size: 1.5rem; font-weight: bold; margin: 0.5rem 0; color: #facc15; }
        .forecast-title { font-size: 0.7rem; margin-top: 0.5rem; opacity: 0.7; }
        .experts-grid { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.3rem; }
        .expert { background: rgba(0,0,0,0.4); border-radius: 2rem; flex: 1; text-align: center; padding: 0.2rem; font-size: 0.7rem; }
        .standings { background: rgba(0,0,0,0.4); border-radius: 1rem; padding: 1rem; margin-bottom: 2rem; overflow-x: auto; }
        .standings table { width: 100%; border-collapse: collapse; }
        .standings th, .standings td { padding: 0.3rem; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .bottom-panel { position: fixed; bottom: 0; left: 0; right: 0; background: #0a1f1e; padding: 0.5rem; text-align: center; border-top: 1px solid #2dd4bf; }
        button { background: #2dd4bf; border: none; padding: 0.3rem 1rem; border-radius: 2rem; cursor: pointer; font-weight: bold; margin-top: 0.5rem; }
        @media (max-width: 700px) { .teams { font-size: 0.9rem; } .score { font-size: 1.2rem; } }
    </style>
</head>
<body>
<div class="container">
    <h1>⚽ ЧМ 2026 · Рейтинг экспертов</h1>
    <div class="sub">Данные из WCF2026.csv (фиксированные колонки)</div>
    <div id="debug" class="debug">Загрузка...</div>
    <div id="expertRank" class="standings"></div>
    <div id="filterBar" class="filter-bar"></div>
    <div id="standings"></div>
    <div id="matches" class="matches-grid"></div>
</div>
<div class="bottom-panel">
    <button id="refreshBtn">🔄 Обновить данные</button>
</div>

<script>
    const FILE = 'WCF2026.csv';
    let matches = [];
    let groupsSet = new Set();
    let currentGroup = 'all';

    // Индексы колонок (0-based)
    const IDX_NUM = 0;      // номер матча
    const IDX_GROUP = 1;    // группа
    const IDX_TIME = 2;     // время
    const IDX_DATE = 3;     // дата
    const IDX_HOME = 4;     // хозяева
    const IDX_AWAY = 5;     // гости
    const IDX_SCORE_H = 6;  // счёт хозяев
    const IDX_SCORE_A = 7;  // счёт гостей
    const IDX_EXP_START = 10; // начало прогнозов (Антон хозяева, Антон гости, ...)

    const EXPERT_NAMES = ['Антон', 'Георгий', 'Герман', 'Олег', 'Тимур', 'Юрий'];
    const EXPERT_PAIR_COUNT = 6;

    async function loadCSV() {
        const debugDiv = document.getElementById('debug');
        debugDiv.innerHTML = '⏳ Загрузка WCF2026.csv...';
        try {
            const response = await fetch(FILE);
            if (!response.ok) throw new Error(`Файл не найден (${response.status})`);
            const text = await response.text();
            const lines = text.split(/\r?\n/);
            debugDiv.innerHTML += `\n✅ Прочитано строк: ${lines.length}`;

            // Ищем первую строку, где в колонке IDX_GROUP (индекс 1) есть буква A-L
            let startRow = -1;
            for (let i = 0; i < lines.length; i++) {
                const cols = lines[i].split(',').map(c => c.replace(/^"|"$/g, '').trim());
                if (cols.length > IDX_GROUP) {
                    const groupVal = cols[IDX_GROUP];
                    if (/^[A-L]$/i.test(groupVal)) {
                        startRow = i;
                        break;
                    }
                }
            }
            if (startRow === -1) throw new Error('Не найдена строка с группой (A, B, C...)');

            matches = [];
            for (let i = startRow; i < lines.length; i++) {
                const cols = lines[i].split(',').map(c => c.replace(/^"|"$/g, '').trim());
                if (cols.length <= IDX_SCORE_A) continue;
                const group = cols[IDX_GROUP];
                if (!/^[A-L]$/i.test(group)) continue; // только строки с группой
                const time = cols[IDX_TIME] || '';
                let date = cols[IDX_DATE] || '';
                if (date.includes('T')) date = date.split('T')[0];
                const home = cols[IDX_HOME] || '';
                const away = cols[IDX_AWAY] || '';
                let score = null;
                const homeScore = parseInt(cols[IDX_SCORE_H]);
                const awayScore = parseInt(cols[IDX_SCORE_A]);
                if (!isNaN(homeScore) && !isNaN(awayScore)) score = `${homeScore}:${awayScore}`;

                const predictions = [];
                for (let e = 0; e < EXPERT_NAMES.length; e++) {
                    const hIdx = IDX_EXP_START + e * 2;
                    const aIdx = hIdx + 1;
                    let pred = '';
                    if (cols.length > aIdx) {
                        const h = parseInt(cols[hIdx]);
                        const a = parseInt(cols[aIdx]);
                        if (!isNaN(h) && !isNaN(a)) pred = `${h}:${a}`;
                    }
                    predictions.push(pred || '—');
                }
                matches.push({ group, date, time, home, away, score, predictions });
                groupsSet.add(group);
            }

            debugDiv.innerHTML += `\n📋 Загружено матчей: ${matches.length}`;
            if (matches.length === 0) throw new Error('Нет данных после обработки');
            buildFilters();
            renderAll();
        } catch (err) {
            debugDiv.innerHTML += `\n❌ Ошибка: ${err.message}\nПроверьте, что файл WCF2026.csv загружен в корень репозитория и соответствует структуре (колонки: номер, группа, время, дата, хозяева, гости, счёт хозяев, счёт гостей, ... прогнозы парами с 10-й колонки).`;
            console.error(err);
        }
    }

    function buildFilters() {
        const groups = Array.from(groupsSet).sort();
        const container = document.getElementById('filterBar');
        container.innerHTML = `<button class="filter-btn active" data-group="all">🌍 Все группы</button>` +
            groups.map(g => `<button class="filter-btn" data-group="${g}">Группа ${g}</button>`).join('');
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentGroup = btn.getAttribute('data-group');
                renderAll();
            });
        });
    }

    function computeExpertStats() {
        let stats = EXPERT_NAMES.map(name => ({ name, points: 0, exact: 0, diff: 0, outcome: 0 }));
        for (let m of matches) {
            if (!m.score) continue;
            const [realHome, realAway] = m.score.split(':').map(Number);
            if (isNaN(realHome) || isNaN(realAway)) continue;
            for (let i = 0; i < EXPERT_NAMES.length; i++) {
                const predStr = m.predictions[i];
                if (!predStr || predStr === '—') continue;
                const [predHome, predAway] = predStr.split(':').map(Number);
                if (isNaN(predHome) || isNaN(predAway)) continue;
                if (predHome === realHome && predAway === realAway) {
                    stats[i].points += 3;
                    stats[i].exact++;
                } else if ((realHome - realAway) === (predHome - predAway)) {
                    stats[i].points += 2;
                    stats[i].diff++;
                } else if ((realHome > realAway && predHome > predAway) || (realHome < realAway && predHome < predAway) || (realHome === realAway && predHome === predAway)) {
                    stats[i].points += 1;
                    stats[i].outcome++;
                }
            }
        }
        stats.sort((a,b) => b.points - a.points || b.exact - a.exact || b.diff - a.diff);
        return stats;
    }

    function renderExpertRanking() {
        const stats = computeExpertStats();
        let html = `<h3>🏆 Рейтинг экспертов (3 — точный счёт, 2 — разница, 1 — исход)</h3>
            <table><thead><tr><th>Место</th><th>Эксперт</th><th>Очки</th><th>Точных<br>счетов</th><th>Разниц<br>(2 очка)</th><th>Исходов<br>(1 очко)</th></tr></thead><tbody>`;
        stats.forEach((s, idx) => {
            html += `<tr><td>${idx+1}</td><td><b>${s.name}</b></td><td>${s.points}</td><td>${s.exact}</td><td>${s.diff}</td><td>${s.outcome}</td></tr>`;
        });
        html += `</tbody></table>`;
        document.getElementById('expertRank').innerHTML = html;
    }

    function renderStandings() {
        if (currentGroup === 'all') {
            document.getElementById('standings').innerHTML = '';
            return;
        }
        const groupMatches = matches.filter(m => m.group === currentGroup && m.score);
        const teams = new Set();
        groupMatches.forEach(m => { teams.add(m.home); teams.add(m.away); });
        let stats = {};
        for (let t of teams) stats[t] = { played:0, wins:0, draws:0, losses:0, gf:0, ga:0, points:0 };
        for (let m of groupMatches) {
            const [hg, ag] = m.score.split(':').map(Number);
            stats[m.home].gf += hg; stats[m.home].ga += ag;
            stats[m.away].gf += ag; stats[m.away].ga += hg;
            stats[m.home].played++; stats[m.away].played++;
            if (hg > ag) { stats[m.home].wins++; stats[m.home].points += 3; stats[m.away].losses++; }
            else if (hg < ag) { stats[m.away].wins++; stats[m.away].points += 3; stats[m.home].losses++; }
            else { stats[m.home].draws++; stats[m.away].draws++; stats[m.home].points++; stats[m.away].points++; }
        }
        let table = Object.entries(stats).map(([name, st]) => ({ name, ...st }));
        table.sort((a,b) => b.points - a.points || (b.gf - b.ga) - (a.gf - a.ga) || b.gf - a.gf);
        let html = `<div class="standings"><h3>📊 Группа ${currentGroup} · Турнирная таблица</h3>
            <table><thead><tr><th>Команда</th><th>И</th><th>В</th><th>Н</th><th>П</th><th>З</th><th>П</th><th>О</th></tr></thead><tbody>`;
        table.forEach(t => {
            html += `<tr><td>${t.name}</td><td>${t.played}</td><td>${t.wins}</td><td>${t.draws}</td><td>${t.losses}</td><td>${t.gf}</td><td>${t.ga}</td><td><b>${t.points}</b></td></tr>`;
        });
        html += `</tbody></table></div>`;
        document.getElementById('standings').innerHTML = html;
    }

    function renderMatches() {
        const filtered = currentGroup === 'all' ? matches : matches.filter(m => m.group === currentGroup);
        let html = '';
        for (let m of filtered) {
            const scoreDisplay = m.score ? m.score : 'TBD';
            html += `
                <div class="card">
                    <div class="card-header">
                        <span class="group-badge">ГРУППА ${m.group}</span>
                        <span>${m.date} ${m.time}</span>
                    </div>
                    <div class="teams">
                        <div class="team">${m.home}</div>
                        <div class="vs">VS</div>
                        <div class="team">${m.away}</div>
                    </div>
                    <div class="score">⚽ СЧЕТ: ${scoreDisplay}</div>
                    <div class="forecast-title">📈 ПРОГНОЗЫ ЭКСПЕРТОВ</div>
                    <div class="experts-grid">
                        ${EXPERT_NAMES.map((name, idx) => `<div class="expert"><b>${name}</b><br>${m.predictions[idx]}</div>`).join('')}
                    </div>
                </div>
            `;
        }
        document.getElementById('matches').innerHTML = html || '<div style="text-align:center">Нет матчей</div>';
    }

    function renderAll() {
        renderExpertRanking();
        renderStandings();
        renderMatches();
    }

    document.getElementById('refreshBtn').addEventListener('click', () => {
        loadCSV().then(() => renderAll());
    });
    loadCSV();
</script>
</body>
</html>
