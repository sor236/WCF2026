<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ЧМ 2026 · Рейтинг экспертов (фиксированные индексы)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 10% 30%, #0a1f1e, #05100f);
            color: #f0f3f8;
            line-height: 1.4;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMDAiIGhlaWdodD0iMzAwIj48ZmlsdGVyIGlkPSJmIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iLjciIG51bU9jdGF2ZXM9IjMiLz48L2ZpbHRlcj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWx0ZXI9InVybCgjZikgb3BhY2l0eT0iMC4wNiIvPjwvc3ZnPg==');
            background-repeat: repeat;
            pointer-events: none;
            opacity: 0.2;
            z-index: 0;
        }
        .app { position: relative; z-index: 2; max-width: 1400px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
        .hero { text-align: center; margin-bottom: 2rem; }
        .hero h1 { font-size: 2.5rem; background: linear-gradient(135deg, #fff, #b9fbc0, #2dd4bf); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .hero .sub { font-size: 1rem; color: #b6e6e0; margin-top: 0.5rem; }
        .experts-rank { background: rgba(0,0,0,0.6); backdrop-filter: blur(12px); border-radius: 1.5rem; padding: 1rem; margin-bottom: 2rem; border: 1px solid rgba(45,212,191,0.4); overflow-x: auto; }
        .rank-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .rank-table th, .rank-table td { padding: 0.6rem 0.3rem; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .rank-table th { background: rgba(45,212,191,0.25); font-weight: 700; }
        .rank-table .expert-name { text-align: left; font-weight: 600; font-size: 1rem; }
        .rank-1 { background: linear-gradient(90deg, #ffd70020, transparent); font-weight: bold; }
        .rank-2 { background: linear-gradient(90deg, #c0c0c020, transparent); }
        .rank-3 { background: linear-gradient(90deg, #cd7f3220, transparent); }
        .filter-bar { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.6rem; margin-bottom: 2rem; }
        .filter-btn { background: rgba(20,35,33,0.7); backdrop-filter: blur(8px); border: 1px solid rgba(72,187,160,0.4); padding: 0.5rem 1.2rem; border-radius: 60px; font-weight: 600; font-size: 0.85rem; color: #e2f2ef; cursor: pointer; }
        .filter-btn.active { background: #2dd4bf; color: #05100f; }
        .standings { background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); border-radius: 1.5rem; padding: 1rem; margin-bottom: 2rem; overflow-x: auto; border: 1px solid rgba(45,212,191,0.3); }
        .standings table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        .standings th, .standings td { padding: 0.5rem 0.3rem; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .matches-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 1.5rem; }
        .match-card { background: rgba(12,27,25,0.75); backdrop-filter: blur(12px); border-radius: 1.5rem; border: 1px solid rgba(45,212,191,0.25); overflow: hidden; }
        .card-header { background: rgba(0,0,0,0.4); padding: 0.7rem 1rem; display: flex; justify-content: space-between; font-size: 0.7rem; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .group-badge { background: #1e2f2c; padding: 0.2rem 0.8rem; border-radius: 30px; font-weight: 700; }
        .teams { display: flex; justify-content: space-between; align-items: center; padding: 1rem; gap: 0.5rem; }
        .team { display: flex; flex-direction: column; align-items: center; gap: 5px; background: rgba(0,0,0,0.3); padding: 0.4rem; border-radius: 2rem; flex: 1; text-align: center; font-size: 0.9rem; font-weight: 600; word-break: break-word; }
        .team i { font-size: 1.2rem; }
        .vs { background: #2dd4bf20; padding: 0.2rem 0.8rem; border-radius: 30px; font-weight: 700; }
        .score { text-align: center; font-size: 1.2rem; font-weight: bold; margin: 0.5rem 1rem; padding: 0.3rem; background: rgba(0,0,0,0.3); border-radius: 2rem; color: #facc15; }
        .forecast-title { font-size: 0.65rem; margin: 0.3rem 1rem; color: #8dcfc6; }
        .experts-grid { display: flex; flex-wrap: wrap; gap: 0.4rem; padding: 0.3rem 1rem 1rem; justify-content: space-between; }
        .expert-pred { background: #0c1f1c; border-radius: 1rem; flex: 1; text-align: center; padding: 0.3rem; font-size: 0.7rem; }
        .debug { background: #1e2f2c; color: #ffaa33; padding: 0.5rem; margin: 1rem 0; border-radius: 1rem; font-family: monospace; white-space: pre-wrap; }
        .bottom-panel { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); display: flex; justify-content: center; gap: 1rem; padding: 0.6rem; border-top: 1px solid #2dd4bf; z-index: 100; }
        .bottom-btn { background: #ffaa33; border: none; padding: 0.4rem 1.2rem; border-radius: 60px; font-weight: 600; font-size: 0.8rem; color: #05100f; cursor: pointer; }
        .footer-note { text-align: center; margin-top: 2rem; font-size: 0.7rem; opacity: 0.6; margin-bottom: 3rem; }
        @media (max-width: 700px) { .team { font-size: 0.75rem; } .score { font-size: 1rem; } }
    </style>
</head>
<body>
<div class="app">
    <div class="hero">
        <h1><i class="fas fa-futbol"></i> ЧМ 2026 · Рейтинг экспертов</h1>
        <div class="sub">Данные из WCF2026.csv (фиксированные колонки)</div>
    </div>
    <div id="debugPanel" class="debug"></div>
    <div id="expertsRankContainer" class="experts-rank"></div>
    <div class="filter-bar" id="filterBar"></div>
    <div id="standingsContainer" class="standings"></div>
    <div class="matches-grid" id="matchesContainer"></div>
    <div class="footer-note">Данные загружены из CSV. Нажмите «Обновить» после изменения файла.</div>
</div>
<div class="bottom-panel">
    <button id="refreshBtn" class="bottom-btn"><i class="fas fa-sync-alt"></i> Обновить данные</button>
</div>

<script>
    const CSV_FILE = 'WCF2026.csv';
    let matches = [];
    let experts = [];
    let currentGroup = 'all';

    async function loadFromCSV() {
        const debugDiv = document.getElementById('debugPanel');
        debugDiv.innerHTML = 'Загрузка файла WCF2026.csv...';
        try {
            const response = await fetch(CSV_FILE);
            if (!response.ok) throw new Error(`HTTP ${response.status}: файл не найден`);
            const csvText = await response.text();
            const rows = csvText.split(/\r?\n/).filter(row => row.trim().length > 0);
            debugDiv.innerHTML += `\nПрочитано строк: ${rows.length}`;

            if (rows.length < 2) throw new Error('Недостаточно строк');

            // Ищем первую строку, которая содержит букву группы (A, B, C, D, E, F, G, H, I, J, K, L)
            let startRow = 0;
            for (let i = 0; i < rows.length; i++) {
                const firstCell = rows[i].split(',')[0].replace(/^"|"$/g, '').trim();
                if (firstCell === 'A' || firstCell === 'B' || firstCell === 'C' || firstCell === 'D' || 
                    firstCell === 'E' || firstCell === 'F' || firstCell === 'G' || firstCell === 'H' ||
                    firstCell === 'I' || firstCell === 'J' || firstCell === 'K' || firstCell === 'L') {
                    startRow = i;
                    break;
                }
            }
            debugDiv.innerHTML += `\nНачальная строка с данными: ${startRow}`;

            // Индексы колонок (0-based, как в CSV после split)
            // В вашем CSV первые несколько колонок могут быть пустыми, но мы опираемся на сдвиг
            // Сначала найдём пустые колонки в начале
            let sampleRow = rows[startRow].split(',').map(c => c.replace(/^"|"$/g, '').trim());
            let firstNonEmpty = sampleRow.findIndex(cell => cell !== '');
            debugDiv.innerHTML += `\nПервая непустая колонка в строке данных: ${firstNonEmpty}`;
            
            // Теперь индексы относительно firstNonEmpty
            const groupIdx = firstNonEmpty;      // 0
            const timeIdx = firstNonEmpty + 1;   // 1
            const dateIdx = firstNonEmpty + 2;   // 2
            const homeIdx = firstNonEmpty + 3;   // 3
            const awayIdx = firstNonEmpty + 4;   // 4
            const scoreHomeIdx = firstNonEmpty + 7;  // 7 (сдвиг по вашему описанию)
            const scoreAwayIdx = firstNonEmpty + 8;  // 8
            const expertStartIdx = firstNonEmpty + 10; // 10 (Антон хозяева)
            
            debugDiv.innerHTML += `\n\nИндексы колонок:
            - группа: ${groupIdx}
            - время: ${timeIdx}
            - дата: ${dateIdx}
            - хозяева: ${homeIdx}
            - гости: ${awayIdx}
            - счёт хозяев: ${scoreHomeIdx}
            - счёт гостей: ${scoreAwayIdx}
            - начало прогнозов: ${expertStartIdx}`;

            const expertNames = ['Антон', 'Георгий', 'Герман', 'Олег', 'Тимур', 'Юрий'];
            matches = [];
            
            for (let i = startRow; i < rows.length; i++) {
                const cols = rows[i].split(',').map(c => c.replace(/^"|"$/g, '').trim());
                if (cols.length < groupIdx + 5) continue;
                const group = cols[groupIdx];
                if (group === '') continue;
                const time = cols[timeIdx] || '';
                const dateRaw = cols[dateIdx] || '';
                let date = dateRaw;
                if (dateRaw.includes('T')) date = dateRaw.split('T')[0];
                const home = cols[homeIdx] || '';
                const away = cols[awayIdx] || '';
                let score = null;
                const homeScore = parseInt(cols[scoreHomeIdx]);
                const awayScore = parseInt(cols[scoreAwayIdx]);
                if (!isNaN(homeScore) && !isNaN(awayScore)) score = `${homeScore}:${awayScore}`;
                
                const predictions = [];
                for (let e = 0; e < expertNames.length; e++) {
                    const homePredIdx = expertStartIdx + e * 2;
                    const awayPredIdx = homePredIdx + 1;
                    let pred = '';
                    if (cols.length > homePredIdx && cols.length > awayPredIdx) {
                        const h = parseInt(cols[homePredIdx]);
                        const a = parseInt(cols[awayPredIdx]);
                        if (!isNaN(h) && !isNaN(a)) pred = `${h}:${a}`;
                    }
                    predictions.push(pred || '—');
                }
                matches.push({ group, date, time, home, away, score, predictions });
            }
            experts = expertNames;
            debugDiv.innerHTML += `\n\nЗагружено матчей: ${matches.length}`;
            if (matches.length === 0) throw new Error('Не найдено строк с данными');

            buildFilterButtons();
            renderExpertsRank();
            renderStandings(currentGroup);
            renderMatches(currentGroup);
        } catch (err) {
            debugDiv.innerHTML += `\n\n❌ ОШИБКА: ${err.message}\nПроверьте, что CSV экспортирован в UTF-8 и содержит данные.`;
            console.error(err);
        }
    }

    function buildFilterButtons() {
        const groups = [...new Set(matches.map(m => m.group).filter(g => g))].sort();
        const container = document.getElementById('filterBar');
        if (groups.length === 0) { container.innerHTML = ''; return; }
        let html = `<button class="filter-btn active" data-group="all">🌍 Все группы</button>`;
        groups.forEach(g => { html += `<button class="filter-btn" data-group="${g}">Группа ${g}</button>`; });
        container.innerHTML = html;
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentGroup = btn.getAttribute('data-group');
                renderMatches(currentGroup);
                renderStandings(currentGroup);
            });
        });
    }

    function getPoints(predStr, realHome, realAway) {
        if (!predStr || predStr === '—') return 0;
        const parts = predStr.split(':');
        if (parts.length !== 2) return 0;
        const ph = parseInt(parts[0]), pa = parseInt(parts[1]);
        if (isNaN(ph) || isNaN(pa)) return 0;
        if (ph === realHome && pa === realAway) return 3;
        const realDiff = realHome - realAway;
        const predDiff = ph - pa;
        if (realDiff === predDiff) return 2;
        const realOutcome = realHome > realAway ? 1 : (realHome === realAway ? 0 : -1);
        const predOutcome = ph > pa ? 1 : (ph === pa ? 0 : -1);
        if (realOutcome === predOutcome) return 1;
        return 0;
    }

    function renderExpertsRank() {
        let stats = experts.map(name => ({ name, points: 0, exact: 0, diff: 0, outcome: 0 }));
        for (let m of matches) {
            if (!m.score) continue;
            const [rh, ra] = m.score.split(':').map(Number);
            if (isNaN(rh) || isNaN(ra)) continue;
            for (let i = 0; i < experts.length; i++) {
                const pts = getPoints(m.predictions[i], rh, ra);
                if (pts === 3) { stats[i].points += 3; stats[i].exact++; }
                else if (pts === 2) { stats[i].points += 2; stats[i].diff++; }
                else if (pts === 1) { stats[i].points += 1; stats[i].outcome++; }
            }
        }
        stats.sort((a,b) => b.points - a.points || b.exact - a.exact || b.diff - a.diff);
        let html = `<h3><i class="fas fa-trophy"></i> Рейтинг экспертов (3 — точный счёт, 2 — разница, 1 — исход)</h3>
            <table class="rank-table"><thead><tr><th>Место</th><th>Эксперт</th><th>Очки</th><th>Точных<br>счетов</th><th>Разниц<br>(2 очка)</th><th>Исходов<br>(1 очко)</th></tr></thead><tbody>`;
        stats.forEach((s, idx) => {
            let medal = idx === 0 ? 'rank-1' : idx === 1 ? 'rank-2' : idx === 2 ? 'rank-3' : '';
            html += `<tr class="${medal}"><td>${idx+1}</td><td class="expert-name">${s.name}</td>
                     <td><strong>${s.points}</strong></td><td>${s.exact}</td><td>${s.diff}</td><td>${s.outcome}</td></tr>`;
        });
        html += `</tbody></table></div>`;
        document.getElementById('expertsRankContainer').innerHTML = html;
    }

    function renderStandings(group) {
        if (group === 'all') { document.getElementById('standingsContainer').innerHTML = ''; return; }
        const groupMatches = matches.filter(m => m.group === group && m.score);
        const teams = new Set();
        groupMatches.forEach(m => { teams.add(m.home); teams.add(m.away); });
        let stats = {};
        for (let t of teams) stats[t] = { played:0, wins:0, draws:0, losses:0, gf:0, ga:0, points:0 };
        for (let m of groupMatches) {
            const [hg, ag] = m.score.split(':').map(Number);
            stats[m.home].gf += hg; stats[m.home].ga += ag;
            stats[m.away].gf += ag; stats[m.away].ga += hg;
            stats[m.home].played++; stats[m.away].played++;
            if (hg > ag) { stats[m.home].wins++; stats[m.home].points += 3; stats[m.away].losses++; }
            else if (hg < ag) { stats[m.away].wins++; stats[m.away].points += 3; stats[m.home].losses++; }
            else { stats[m.home].draws++; stats[m.away].draws++; stats[m.home].points++; stats[m.away].points++; }
        }
        let table = Object.entries(stats).map(([name, st]) => ({ name, ...st }));
        table.sort((a,b) => b.points - a.points || (b.gf - b.ga) - (a.gf - a.ga) || b.gf - a.gf);
        let html = `<div class="standings"><h3><i class="fas fa-table"></i> Группа ${group} · Турнирная таблица</h3>
            <table><thead><tr><th>Команда</th><th>И</th><th>В</th><th>Н</th><th>П</th><th>З</th><th>П</th><th>О</th></tr></thead><tbody>`;
        table.forEach(t => {
            html += `<tr><td class="team-name">${t.name}</td>
                       <td>${t.played}</td><td>${t.wins}</td><td>${t.draws}</td><td>${t.losses}</td>
                       <td>${t.gf}</td><td>${t.ga}</td><td><strong>${t.points}</strong></td>
                    <tr>`;
        });
        html += `</tbody></table></div>`;
        document.getElementById('standingsContainer').innerHTML = html;
    }

    function renderMatches(group) {
        let filtered = group === 'all' ? matches : matches.filter(m => m.group === group);
        if (filtered.length === 0) {
            document.getElementById('matchesContainer').innerHTML = '<div style="text-align:center; padding:2rem;">Нет матчей</div>';
            return;
        }
        let html = '';
        for (let m of filtered) {
            const scoreDisplay = m.score ? m.score : 'TBD';
            html += `
                <div class="match-card">
                    <div class="card-header">
                        <span class="group-badge">ГРУППА ${m.group}</span>
                        <span>${m.date} ${m.time}</span>
                    </div>
                    <div class="teams">
                        <div class="team"><i class="fas fa-shield-alt"></i> ${m.home}</div>
                        <div class="vs">VS</div>
                        <div class="team">${m.away} <i class="fas fa-shield-alt"></i></div>
                    </div>
                    <div class="score"><i class="fas fa-trophy"></i> СЧЕТ: ${scoreDisplay}</div>
                    <div class="forecast-title"><i class="fas fa-chart-simple"></i> ПРОГНОЗЫ ЭКСПЕРТОВ</div>
                    <div class="experts-grid">
                        ${experts.map((exp, idx) => `<div class="expert-pred"><div>${exp}</div><div>${m.predictions[idx]}</div></div>`).join('')}
                    </div>
                </div>
            `;
        }
        document.getElementById('matchesContainer').innerHTML = html;
    }

    document.getElementById('refreshBtn').addEventListener('click', async () => {
        const btn = document.getElementById('refreshBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Загрузка...';
        await loadFromCSV();
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-sync-alt"></i> Обновить данные';
    });

    loadFromCSV();
</script>
</body>
</html>
