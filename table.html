    const experts = ["Антон", "Георгий", "Герман", "Олег", "Тимур", "Юрий"];

    function getPoints(predStr, realHome, realAway) {
        if (!predStr || predStr === "—") return 0;
        const parts = predStr.split(':');
        if (parts.length !== 2) return 0;
        const predHome = parseInt(parts[0], 10);
        const predAway = parseInt(parts[1], 10);
        if (isNaN(predHome) || isNaN(predAway)) return 0;
        if (predHome === realHome && predAway === realAway) return 3;
        const realDiff = realHome - realAway;
        const predDiff = predHome - predAway;
        if (realDiff === predDiff) return 2;
        const realOutcome = realHome > realAway ? 1 : (realHome === realAway ? 0 : -1);
        const predOutcome = predHome > predAway ? 1 : (predHome === predAway ? 0 : -1);
        if (realOutcome === predOutcome) return 1;
        return 0;
    }

    function renderTable() {
        // --- Вычисляем суммы очков для каждого эксперта по сыгранным матчам ---
        const expertScores = experts.map(() => 0);
        matchesData.forEach(m => {
            const realHome = m.homeScore;
            const realAway = m.awayScore;
            const isPlayed = (realHome !== null && realHome !== undefined && realAway !== null && realAway !== undefined);
            if (!isPlayed) return;
            if (!m.pred) return;
            m.pred.forEach((pred, idx) => {
                const pts = getPoints(pred, realHome, realAway);
                expertScores[idx] += pts;
            });
        });

        // Сортируем экспертов по убыванию очков для определения мест
        const sorted = experts.map((name, idx) => ({ name, idx, score: expertScores[idx] }));
        sorted.sort((a, b) => b.score - a.score);

        // Присваиваем ранги
        const rankMap = {};
        sorted.forEach((item, rank) => {
            rankMap[item.idx] = rank + 1;
        });

        const scrollDiv = document.getElementById('tableScroll');
        let html = '<table><thead>';
        // Первая строка заголовка
        html += '<tr class="header-row-main">';
        html += '<th rowspan="2">#</th>';
        html += '<th rowspan="2">Гр.</th>';
        html += '<th rowspan="2">Время</th>';
        html += '<th rowspan="2">Дата</th>';
        html += '<th rowspan="2">Команда 1</th>';
        html += '<th rowspan="2">Команда 2</th>';
        html += '<th rowspan="2">Счёт</th>';
        experts.forEach((exp, idx) => {
            const rank = rankMap[idx] || 0;
            let rankClass = '';
            if (rank === 1) rankClass = 'rank-1';
            else if (rank === 2) rankClass = 'rank-2';
            else if (rank === 3) rankClass = 'rank-3';
            const total = expertScores[idx];
            html += `<th colspan="2" class="expert-header-main ${rankClass}">
                        <span class="expert-name">${exp}</span>
                        <span class="expert-score">(${total})</span>
                     </th>`;
        });
        html += '</tr>';

        // Вторая строка заголовка – подзаголовки "прогноз" и "очки"
        html += '<tr class="header-row-sub">';
        experts.forEach(() => {
            html += `<th class="expert-header-sub">прогноз</th>`;
            html += `<th class="expert-header-sub">очки</th>`;
        });
        html += '</tr>';
        html += '</thead><tbody>';

        // Данные
        matchesData.forEach(m => {
            const realHome = m.homeScore;
            const realAway = m.awayScore;
            const isPlayed = (realHome !== null && realHome !== undefined && realAway !== null && realAway !== undefined);
            html += `<tr>`;
            html += `<td class="match-id">${m.id}</td>`;
            html += `<td class="group-cell">${m.group}</td>`;
            html += `<td>${m.time}</td>`;
            html += `<td>${m.date}</td>`;
            const homeClass = isPlayed ? (realHome > realAway ? 'team-win' : (realHome < realAway ? 'team-loss' : 'team-draw')) : '';
            const awayClass = isPlayed ? (realAway > realHome ? 'team-win' : (realAway < realHome ? 'team-loss' : 'team-draw')) : '';
            html += `<td class="team-cell ${homeClass}" title="${m.home}">${m.home}</td>`;
            html += `<td class="team-cell ${awayClass}" title="${m.away}">${m.away}</td>`;
            if (isPlayed) {
                html += `<td class="score-cell">${realHome}:${realAway}</td>`;
            } else {
                html += `<td>—</td>`;
            }

            if (m.pred) {
                m.pred.forEach((pred, idx) => {
                    // Для несыгранных матчей выводим "-" вместо очков
                    if (!isPlayed) {
                        html += `<td class="expert-pred">${pred}</td>`;
                        html += `<td class="expert-points">—</td>`;
                    } else {
                        let points = getPoints(pred, realHome, realAway);
                        let ptsClass = '';
                        if (points === 3) ptsClass = 'points-3';
                        else if (points === 2) ptsClass = 'points-2';
                        else if (points === 1) ptsClass = 'points-1';
                        else ptsClass = 'points-0';
                        html += `<td class="expert-pred">${pred}</td>`;
                        html += `<td class="expert-points ${ptsClass}">${points}</td>`;
                    }
                });
            } else {
                experts.forEach(() => {
                    html += `<td>—</td><td>—</td>`;
                });
            }
            html += '</tr>';
        });

        html += '</tbody></table>';
        scrollDiv.innerHTML = html;

        // ===== ЗАКРЕПЛЕНИЕ ШАПКИ: вычисляем высоту первой строки и задаём top для второй =====
        const table = scrollDiv.querySelector('table');
        if (table) {
            const mainRow = table.querySelector('.header-row-main');
            const subRow = table.querySelector('.header-row-sub');
            if (mainRow && subRow) {
                const mainHeight = mainRow.offsetHeight;
                // Устанавливаем top для второй строки
                const subCells = subRow.querySelectorAll('th');
                subCells.forEach(cell => {
                    cell.style.top = mainHeight + 'px';
                });
                // Для первой строки top = 0 (уже по умолчанию, но продублируем)
                const mainCells = mainRow.querySelectorAll('th');
                mainCells.forEach(cell => {
                    cell.style.top = '0px';
                });
            }
        }
    }

    renderTable();
</script>
